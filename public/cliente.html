<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Chat</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="cliente-body">
    <main class="cliente-chat">
      <header class="cliente-header">
        <button type="button" class="cliente-back-button">‹</button>

        <div class="cliente-avatar">
          <img src="images/avatar.png" alt="casino" />
        </div>

        <div class="cliente-header-info">
          <h1>Sofi❤️</h1>
          <p>En línea</p>
        </div>

        <button type="button" class="cliente-menu-button">⋮</button>
      </header>

      <section id="messages" class="cliente-messages">
        <div class="message received"></div>
      </section>
      <div
        id="push-permission-box"
        class="push-permission-box"
        style="display: none"
      >
        <div>
          <strong>🔔 Activá las notificaciones</strong>
          <p>Para recibir un bono de bienvenida!</p>
        </div>

        <button id="enable-push-button" type="button">Activar</button>
      </div>
      <form id="message-form" class="cliente-form">
        <input type="file" id="image-input" accept="image/*" hidden />

        <button type="button" id="image-button" class="image-button">📎</button>
        <input
          type="text"
          id="message-input"
          placeholder="Escribí un mensaje..."
          autocomplete="off"
        />

        <button type="submit" class="cliente-send-button" aria-label="Enviar">
          ➤
        </button>
      </form>
    </main>
    <div id="image-viewer" class="image-viewer">
      <button
        id="image-viewer-close"
        class="image-viewer-close"
        type="button"
        aria-label="Cerrar imagen"
      >
        ×
      </button>

      <img id="image-viewer-img" src="" alt="Imagen ampliada" />
    </div>
    <div id="avatar-viewer" class="avatar-viewer">
      <button id="avatar-viewer-close" class="avatar-viewer-close">←</button>

      <img
        id="avatar-viewer-img"
        src="images/avatar.png"
        alt="Foto de perfil"
      />
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="cliente.js"></script>
  </body>
</html>
